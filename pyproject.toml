[project]
name = "paint-locker"
version = "1.1.0"
description = "Self-hosted miniature paint inventory: catalogue, storage racks, mix recipes and a purchase recommender."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/Nick-C130/paint-locker"
Issues = "https://github.com/Nick-C130/paint-locker/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/static/vendor", "app/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the intended pattern
    "E501",  # long template strings and SQL
    "E741",  # l/L for lightness is standard colour-maths naming
    "B905",  # zip() over arrays of known equal length
    "C408",  # dict(...) reads better for template contexts
    "SIM108",
]
