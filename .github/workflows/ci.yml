name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  image:
    # Builds a multi-arch (amd64 + arm64) image and pushes it to GitHub Container Registry on main.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paint-locker" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build test image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: paint-locker:test
      - name: Smoke test (fresh root-owned bind mount, like the deploy compose file)
        run: |
          sudo mkdir -p /tmp/pl-data && sudo chown root:root /tmp/pl-data
          docker run -d --name pl -p 8080:8080 -v /tmp/pl-data:/data paint-locker:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 2; done
          curl -fsS http://localhost:8080/ > /dev/null
          test -f /tmp/pl-data/paintlocker.db || (ls -la /tmp/pl-data; docker logs pl; exit 1)
          docker logs pl | tail -5
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
