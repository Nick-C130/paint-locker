version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Move to a new Python minor by hand once numpy and the other wheels support it.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
